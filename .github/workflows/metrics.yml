name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * FRI"

permissions:
  contents: write

concurrency:
  group: metrics-main
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: python -m pip install python-dateutil

      - name: Generate reports
        run: |
          python development/toml_to_report.py
          python development/toml_to_csv.py
          python development/toml_to_navigator.py

      - name: Commit generated metrics if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/latestdetections.md metrics/detectiondata.csv metrics/navigator.json
          if git diff --cached --quiet; then
            echo "No changes to generated metrics"
            exit 0
          fi
          git commit -m "chore: update generated detection metrics"
          git push origin HEAD:main
